name: Build Brain APK

# Real CI entry point (Rule 1 endpoint) for the Termux -> git push -> GitHub
# Actions -> APK pipeline documented in PROGRESS.md. This file was missing
# from the Phase 4 zip (a genuine broken chain: PROGRESS.md's "Validation
# status" notes for every phase say "first real validation is the GitHub
# Actions run after your git push", which was impossible without this
# workflow existing) - recreated here per that same documented spec,
# nothing else in the repo touched (Rule 19 - additive only).
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK + CMake
        run: |
          sdkmanager --install "ndk;26.3.11579264" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: brain-debug-apk
          path: app/build/outputs/apk/debug/*.apk
